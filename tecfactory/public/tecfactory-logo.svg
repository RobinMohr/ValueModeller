<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 36" fill="none">
  <!-- TecFactory Logo — AI Agent Factory concept -->
  <!-- Icon mark: gear with circuit nodes representing an AI factory -->
  <g transform="translate(4, 2)">
    <!-- Central gear/cog shape -->
    <path d="M16 7.5L17.5 5L19 7.5L21.5 7L22 9.5L24.5 10.5L24 13L25.5 15L24 17L24.5 19.5L22 20.5L21.5 23L19 22.5L17.5 25L16 22.5L13.5 23L13 20.5L10.5 19.5L11 17L9.5 15L11 13L10.5 10.5L13 9.5L13.5 7L16 7.5Z" fill="#ff8700" opacity="0.9"/>
    <!-- Inner circle (gear center) -->
    <circle cx="17" cy="15" r="4.5" fill="#1a1a2e"/>
    <!-- AI "eye" / neural dot in center -->
    <circle cx="17" cy="15" r="2" fill="#ff8700"/>
    <!-- Circuit connection nodes (agent outputs) -->
    <circle cx="5" cy="10" r="2.5" fill="#ff8700" opacity="0.7"/>
    <circle cx="5" cy="20" r="2.5" fill="#ff8700" opacity="0.7"/>
    <circle cx="29" cy="10" r="2.5" fill="#ff8700" opacity="0.7"/>
    <circle cx="29" cy="20" r="2.5" fill="#ff8700" opacity="0.7"/>
    <!-- Connection lines from center to nodes -->
    <line x1="12" y1="12" x2="7" y2="10" stroke="#ff8700" stroke-width="1.2" opacity="0.5"/>
    <line x1="12" y1="18" x2="7" y2="20" stroke="#ff8700" stroke-width="1.2" opacity="0.5"/>
    <line x1="22" y1="12" x2="27" y2="10" stroke="#ff8700" stroke-width="1.2" opacity="0.5"/>
    <line x1="22" y1="18" x2="27" y2="20" stroke="#ff8700" stroke-width="1.2" opacity="0.5"/>
  </g>
  <!-- "TecFactory" wordmark -->
  <text x="42" y="24" font-family="Barlow, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#ffffff">Tec</tspan><tspan fill="#ff8700">Factory</tspan>
  </text>
</svg>
